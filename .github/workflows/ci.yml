name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: shellcheck + hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      # apt's yq is the Python jq wrapper; the AGENTS.md generator needs mikefarah v4.
      - name: Install yq (mikefarah v4)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: shellcheck
        run: shellcheck plugins/conventions/hooks/*.sh plugins/conventions/scripts/*.sh plugins/conventions/skills/port-claude-config/scripts/*.sh tests/*.sh

      - name: Hook tests
        env:
          REQUIRE_YQ: "1"
        run: tests/run.sh
